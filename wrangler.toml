name = "hijabi-bridal-cloudflare"
main = "src/index.js"name = "hijabi-bridal-cloudflare"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Plain (non-secret) variables — set here, not just in the dashboard,
# specifically because dashboard-only values can get silently wiped out
# by a future deploy if they aren't also defined in this file.
[vars]
PAYPAL_ENV = "live"
EMAIL_FROM = "Hijabi Bridal <orders@halalnails.vip>"

[[kv_namespaces]]
binding = "ORDERS_KV"
id = "914e04ae5ab94be5a92d9a3cea37cf81"

# Enables persistent, searchable logs in the Cloudflare dashboard —
# without this, only a live "watch it happen right now" stream works,
# and nothing gets saved to look back at afterward.
[observability]
enabled = true

[observability.logs]
enabled = true
compatibility_date = "2026-09-01"

